name: Atualizar XP e mortes de jogadores ativos

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar XP ranqueado e mortes recentes
        run: python scripts/collect_player_history.py
      - name: Salvar CSVs do histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-history
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no histórico de XP e mortes."
            exit 0
          fi
          git commit -m "Atualiza histórico de XP e mortes"
          git push
