name: Atualizar banco Players Ativos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-character-registry
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar mundos, registrar jogadores e atualizar fichas
        run: python scripts/collect_active_characters.py
      - name: Salvar banco CSV atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players-ativos
          if git diff --cached --quiet; then
            echo "Nenhum registro novo ou alterado."
            exit 0
          fi
          git commit -m "Atualiza banco Players Ativos"
          git push
